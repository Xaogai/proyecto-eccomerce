<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vista 360 en móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}
:focus-visible{outline:3px solid #F26B2A;outline-offset:2px}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="t" style="width: 390px; height: 844px; background: #0E1012; color: #FFFFFF; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45; display: flex; flex-direction: column">
  <div style="padding: 10px 8px 10px 16px; display: flex; align-items: center; gap: 8px">
    <h1 id="t" style="margin: 0; flex: 1; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; text-transform: uppercase">Vista 360°</h1>
    <a href="Movil-4-Ficha.dc.html" aria-label="Cerrar" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
  </div>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; color: #C9D0D6">
    <svg width="300" height="225" viewBox="0 0 120 90" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Taladro visto a {{angle}} grados" style="transform: {{tf}}"><path d="M18 20h60a8 8 0 0 1 8 8v10a8 8 0 0 1-8 8H58l-6 30H34l4-30H18a6 6 0 0 1-6-6V26a6 6 0 0 1 6-6z"/><path d="M86 33h14"/><path d="M100 30v6l14-3z"/><path d="M30 76h26"/></svg>
  </div>
  <div style="padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <button type="button" onClick="{{left}}" aria-label="Girar a la izquierda" style="width: 52px; height: 52px; border: 0; border-radius: 4px; background: #1F2327; color: #FFFFFF; font: inherit; font-size: 24px">‹</button>
      <label for="a" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ángulo</label>
      <input id="a" type="range" min="0" max="345" step="15" value="{{angle}}" onInput="{{slide}}" aria-valuetext="{{angle}} grados" style="flex: 1; accent-color: #C2410C">
      <button type="button" onClick="{{right}}" aria-label="Girar a la derecha" style="width: 52px; height: 52px; border: 0; border-radius: 4px; background: #1F2327; color: #FFFFFF; font: inherit; font-size: 24px">›</button>
    </div>
    <span aria-live="polite" style="text-align: center; color: #B7C0C8">Vista a {{angle}}° · desliza para girar</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { a: 45 }; }
  renderVals() {
    const a = this.state.a;
    const set = v => this.setState({ a: ((v % 360) + 360) % 360 });
    const flip = a > 90 && a < 270 ? -1 : 1;
    const squash = Math.max(0.35, Math.abs(Math.cos(a * Math.PI / 180)));
    return { angle: a, tf: 'scaleX(' + (flip * squash).toFixed(2) + ')', left: () => set(a - 15), right: () => set(a + 15), slide: e => set(Number(e.target.value)) };
  }
}
</script>
</body>
</html>
