<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Departamentos en móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#15181B}a:hover{color:#C2410C}
:focus-visible{outline:3px solid #F26B2A;outline-offset:2px}
</style>
</helmet>
<nav aria-labelledby="dt" style="width: 390px; height: 844px; background: #FFFFFF; color: #15181B; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45; display: flex; flex-direction: column">
  <div style="background: #15181B; color: #FFFFFF; padding: 8px 8px 8px 16px; display: flex; align-items: center; gap: 8px">
    <h1 id="dt" style="margin: 0; flex: 1; font-family: 'Barlow Condensed', sans-serif; font-size: 28px; text-transform: uppercase">Departamentos</h1>
    <a href="Movil-9-Inicio.dc.html" aria-label="Cerrar menú" style="width: 48px; height: 48px; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
  </div>
  <sc-if value="{{hasBack}}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{back}}" style="min-height: 52px; border: 0; border-bottom: 1px solid #E3E7EA; background: #F5F6F7; font: inherit; font-weight: 600; text-align: left; padding: 0 16px; display: flex; align-items: center; gap: 8px">‹ {{backLabel}}</button>
  </sc-if>
  <p aria-live="polite" style="margin: 0; padding: 12px 16px 4px; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 600; text-transform: uppercase; color: #C2410C">{{levelTitle}}</p>
  <ul style="list-style: none; margin: 0; padding: 0">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="8">
      <li>
        <sc-if value="{{it.leaf}}" hint-placeholder-val="{{ false }}">
          <a href="Movil-1-Listado.dc.html" style="min-height: 54px; padding: 0 16px; display: flex; align-items: center; text-decoration: none; border-bottom: 1px solid #EDEFF1">{{it.name}}</a>
        </sc-if>
        <sc-if value="{{it.branch}}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{it.open}}" aria-label="{{it.name}}, ver subcategorías" style="width: 100%; min-height: 54px; padding: 0 16px; border: 0; border-bottom: 1px solid #EDEFF1; background: #FFFFFF; font: inherit; text-align: left; display: flex; align-items: center; justify-content: space-between">{{it.name}} <span aria-hidden="true" style="color: #4E5862">›</span></button>
        </sc-if>
      </li>
    </sc-for>
  </ul>
  <div style="margin-top: auto; padding: 16px; border-top: 1px solid #E3E7EA; display: flex; flex-direction: column; gap: 4px">
    <a href="Movil-15-Tiendas.dc.html" style="min-height: 44px; display: flex; align-items: center">Sucursales</a>
    <a href="Movil-14-Calculadora.dc.html" style="min-height: 44px; display: flex; align-items: center">Calculadora de materiales</a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { path: [] }; }
  renderVals() {
    const T = {
      'Herramientas': { 'Herramientas eléctricas': ['Taladros', 'Rotomartillos', 'Esmeriladoras', 'Sierras', 'Baterías y cargadores'], 'Herramientas manuales': ['Martillos', 'Desarmadores', 'Llaves', 'Pinzas'], 'Accesorios': ['Brocas', 'Discos', 'Puntas'] },
      'Construcción': { 'Cemento y morteros': ['Cemento gris', 'Mortero', 'Pegazulejo'], 'Block y tabique': ['Block', 'Tabique rojo'] },
      'Pisos y azulejos': { 'Pisos': ['Cerámica', 'Porcelanato', 'Laminado'], 'Azulejos': ['Baño', 'Cocina'] },
      'Pintura': { 'Interior': ['Vinílica', 'Esmalte'], 'Exterior': ['Impermeabilizante', 'Fachadas'] },
      'Plomería': { 'Tubería': ['PVC', 'Cobre'], 'Llaves y mezcladoras': ['Lavabo', 'Regadera'] },
      'Electricidad': { 'Cable': ['Cable calibre 12', 'Cable calibre 14'], 'Iluminación': ['Focos LED', 'Lámparas'] },
      'Jardín': { 'Riego': ['Mangueras', 'Aspersores'], 'Herramienta de jardín': ['Palas', 'Tijeras'] },
      'Ferretería': { 'Fijación': ['Tornillos', 'Taquetes', 'Clavos'], 'Seguridad': ['Candados', 'Chapas'] }
    };
    const p = this.state.path;
    let node = T;
    p.forEach(k => { node = node[k]; });
    const isLeafLevel = Array.isArray(node);
    const names = isLeafLevel ? node : Object.keys(node);
    const titles = ['Todos los departamentos', p[0], p[1]];
    return {
      hasBack: p.length > 0,
      backLabel: p.length === 1 ? 'Todos los departamentos' : (p[0] || ''),
      back: () => this.setState({ path: this.state.path.slice(0, -1) }),
      levelTitle: (titles[p.length] || '') + (p.length ? ' · nivel ' + (p.length + 1) + ' de 3' : ''),
      items: names.map(name => ({
        name, leaf: isLeafLevel, branch: !isLeafLevel,
        open: () => this.setState({ path: [...this.state.path, name] })
      })).concat(isLeafLevel ? [] : [])
    };
  }
}
</script>
</body>
</html>
