<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Devolución en móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#15181B}a:hover{color:#C2410C}
:focus-visible{outline:3px solid #F26B2A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 1300px; position: relative; background: #EDEFF1; color: #15181B; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45">
  <header style="background: #15181B; color: #FFFFFF; padding: 8px 10px; display: flex; align-items: center; gap: 4px">
    <a href="Movil-19-Seguimiento.dc.html" aria-label="Volver al pedido" style="width: 44px; height: 44px; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 style="margin: 0; flex: 1; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; text-transform: uppercase">Devolver productos</h1>
  </header>
  <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
    <main style="padding: 16px">
      <section role="status" style="background: #FFFFFF; border-radius: 6px; padding: 18px; border: 2px solid #1E7A46; display: flex; flex-direction: column; gap: 8px">
        <strong style="color: #1E7A46">Solicitud DEV-0388 enviada</strong>
        <span>Lleva el producto con su empaque a cualquier sucursal. Reembolsamos $1,299 a tu tarjeta terminación 4821 en 5 a 10 días hábiles.</span>
        <a href="Movil-18-Pedidos.dc.html" style="min-height: 50px; border-radius: 4px; background: #15181B; color: #FFFFFF; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Volver a mis pedidos</a>
      </section>
    </main>
  </sc-if>
  <sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
    <form novalidate style="padding: 14px 16px 110px; display: flex; flex-direction: column; gap: 12px">
      <div style="background: #FBEFD6; border-radius: 6px; padding: 12px; font-size: 15px">Puedes devolver hasta el 1 de noviembre. <a href="#" style="font-weight: 600">Política</a></div>
      <fieldset style="background: #FFFFFF; border-radius: 6px; padding: 14px; border: 0; margin: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase; float: left; width: 100%; margin-bottom: 4px">1. Productos</legend>
        <label style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 4px; border: 2px solid #C2410C; font-size: 15px"><input type="checkbox" checked style="width: 22px; height: 22px; flex: none; accent-color: #C2410C"><span><strong>Taladro atornillador 12 V</strong><br>1 pieza · $1,299</span></label>
        <label style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 4px; border: 1px solid #D3D8DD; font-size: 15px"><input type="checkbox" style="width: 22px; height: 22px; flex: none; accent-color: #C2410C"><span><strong>Taquetes 1/4 pulg, 100 pzas</strong><br>2 piezas · $78 c/u</span></label>
      </fieldset>
      <fieldset style="background: #FFFFFF; border-radius: 6px; padding: 14px; border: 0; margin: 0; display: flex; flex-direction: column; gap: 2px">
        <legend style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase; float: left; width: 100%; margin-bottom: 4px">2. Motivo</legend>
        <sc-for list="{{reasons}}" as="r" hint-placeholder-count="5">
          <label style="display: flex; gap: 12px; align-items: center; min-height: 48px; font-size: 15px"><input type="radio" name="motivo" checked="{{r.on}}" onChange="{{r.pick}}" style="width: 22px; height: 22px; flex: none; accent-color: #C2410C"> {{r.label}}</label>
        </sc-for>
        <sc-if value="{{needsPhoto}}" hint-placeholder-val="{{ true }}">
          <label style="display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 15px; margin-top: 6px">Foto del problema (obligatoria)<input type="file" accept="image/*" style="font: inherit; font-weight: 400"></label>
        </sc-if>
      </fieldset>
      <fieldset style="background: #FFFFFF; border-radius: 6px; padding: 14px; border: 0; margin: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase; float: left; width: 100%; margin-bottom: 4px">3. Entrega</legend>
        <label style="display: flex; gap: 12px; align-items: flex-start; padding: 10px; border-radius: 4px; border: 2px solid #15181B; font-size: 15px"><input type="radio" name="ent" checked style="width: 22px; height: 22px; flex: none; accent-color: #C2410C"><span><strong>En sucursal</strong><br>Gratis</span></label>
        <label style="display: flex; gap: 12px; align-items: flex-start; padding: 10px; border-radius: 4px; border: 1px solid #D3D8DD; font-size: 15px"><input type="radio" name="ent" style="width: 22px; height: 22px; flex: none; accent-color: #C2410C"><span><strong>Recolección a domicilio</strong><br>Costo según tu CP</span></label>
      </fieldset>
    </form>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #D3D8DD; padding: 12px 16px 16px">
      <button type="button" onClick="{{send}}" style="width: 100%; min-height: 52px; border: 0; border-radius: 4px; background: #C2410C; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 17px">Enviar solicitud</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { r: 1, sent: false }; }
  renderVals() {
    const R = ['Ya no lo necesito', 'Llegó dañado o no funciona', 'No es lo que pedí', 'Le faltan piezas', 'Otro motivo'];
    const r = this.state.r;
    return { sent: this.state.sent, editing: !this.state.sent, needsPhoto: r === 1 || r === 3, reasons: R.map((label, i) => ({ label, on: i === r, pick: () => this.setState({ r: i }) })), send: () => this.setState({ sent: true }) };
  }
}
</script>
</body>
</html>
