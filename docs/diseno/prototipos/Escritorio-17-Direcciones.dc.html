<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Direcciones guardadas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#15181B}a:hover{color:#C2410C}
:focus-visible{outline:3px solid #F26B2A;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 1000px; background: #EDEFF1; color: #15181B; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.45">
  <header style="background: #15181B; color: #FFFFFF">
    <div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
      <a href="Escritorio-6-Inicio.dc.html" style="font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 700; color: #FFFFFF; text-decoration: none">[MARCA]<span style="color: #F26B2A">.</span></a>
      <span style="flex: 1"></span>
      <a href="Escritorio-14-MiCuenta.dc.html" style="color: #FFFFFF; min-height: 44px; display: flex; align-items: center">Hola, Ana</a>
      <a href="Escritorio-3-Carrito.dc.html" style="color: #FFFFFF; min-height: 44px; display: flex; align-items: center">Carrito (3)</a>
    </div>
  </header>
  <div style="max-width: 1200px; margin: 0 auto; padding: 24px 24px 48px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
    <nav aria-label="Mi cuenta" style="flex: 1 1 220px; background: #FFFFFF; border-radius: 6px; padding: 8px; display: flex; flex-direction: column">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
        <a href="{{n.href}}" aria-current="{{n.cur}}" style="min-height: 46px; padding: 0 14px; border-radius: 4px; text-decoration: none; display: flex; align-items: center; background: {{n.bg}}; color: {{n.fg}}; font-weight: {{n.w}}">{{n.label}}</a>
      </sc-for>
    </nav>
    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
        <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 48px; line-height: 1; text-transform: uppercase">Direcciones</h1>
        <button type="button" onClick="{{toggleForm}}" aria-expanded="{{formOpen}}" style="min-height: 46px; padding: 0 18px; border: 0; border-radius: 4px; background: #C2410C; color: #FFFFFF; font: inherit; font-weight: 600">Agregar dirección</button>
      </div>
      <p aria-live="polite" style="margin: 0; color: #4E5862">{{msg}}</p>
      <sc-if value="{{showForm}}" hint-placeholder-val="{{ false }}">
        <form style="background: #FFFFFF; border-radius: 6px; padding: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <label style="display: flex; flex-direction: column; gap: 4px; font-weight: 600">Nombre de la dirección<input type="text" placeholder="Ej. Trabajo" style="height: 48px; border: 1px solid #B9C1C8; border-radius: 4px; padding: 0 12px; font: inherit; font-weight: 400"></label>
          <label style="display: flex; flex-direction: column; gap: 4px; font-weight: 600">Código postal<input type="text" inputmode="numeric" style="height: 48px; border: 1px solid #B9C1C8; border-radius: 4px; padding: 0 12px; font: inherit; font-weight: 400"></label>
          <label style="display: flex; flex-direction: column; gap: 4px; font-weight: 600; grid-column: 1 / -1">Calle y número<input type="text" style="height: 48px; border: 1px solid #B9C1C8; border-radius: 4px; padding: 0 12px; font: inherit; font-weight: 400"></label>
          <label style="display: flex; flex-direction: column; gap: 4px; font-weight: 600">Colonia<input type="text" style="height: 48px; border: 1px solid #B9C1C8; border-radius: 4px; padding: 0 12px; font: inherit; font-weight: 400"></label>
          <label style="display: flex; flex-direction: column; gap: 4px; font-weight: 600">Teléfono de contacto<input type="tel" style="height: 48px; border: 1px solid #B9C1C8; border-radius: 4px; padding: 0 12px; font: inherit; font-weight: 400"></label>
          <div style="grid-column: 1 / -1; display: flex; gap: 8px"><button type="button" style="min-height: 46px; padding: 0 18px; border: 0; border-radius: 4px; background: #15181B; color: #FFFFFF; font: inherit; font-weight: 600">Guardar</button><button type="button" onClick="{{toggleForm}}" style="min-height: 46px; padding: 0 18px; border: 1px solid #B9C1C8; border-radius: 4px; background: #FFFFFF; font: inherit">Cancelar</button></div>
        </form>
      </sc-if>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px">
        <sc-for list="{{addrs}}" as="a" hint-placeholder-count="2">
          <article style="background: #FFFFFF; border-radius: 6px; padding: 18px; border: {{a.border}}; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 24px">{{a.name}}</h2><sc-if value="{{a.def}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 4px; background: #15181B; color: #FFFFFF">Principal</span></sc-if></div>
            <span>{{a.line1}}</span><span style="color: #4E5862">{{a.line2}}</span>
            <sc-if value="{{a.asking}}" hint-placeholder-val="{{ false }}">
              <div role="alert" style="background: #FBE6E4; border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 8px"><span style="font-weight: 600; color: #B42318">¿Eliminar "{{a.name}}"? No se puede deshacer.</span><div style="display: flex; gap: 8px"><button type="button" onClick="{{a.remove}}" style="min-height: 40px; padding: 0 14px; border: 0; border-radius: 4px; background: #B42318; color: #FFFFFF; font: inherit; font-weight: 600">Sí, eliminar</button><button type="button" onClick="{{a.cancel}}" style="min-height: 40px; padding: 0 14px; border: 1px solid #B9C1C8; border-radius: 4px; background: #FFFFFF; font: inherit">No</button></div></div>
            </sc-if>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px">
              <button type="button" style="min-height: 40px; padding: 0 12px; border: 1px solid #B9C1C8; border-radius: 4px; background: #FFFFFF; font: inherit">Editar</button>
              <sc-if value="{{a.notDef}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{a.makeDef}}" style="min-height: 40px; padding: 0 12px; border: 1px solid #B9C1C8; border-radius: 4px; background: #FFFFFF; font: inherit">Hacer principal</button></sc-if>
              <button type="button" onClick="{{a.ask}}" style="min-height: 40px; padding: 0 12px; border: 0; background: transparent; font: inherit; color: #B42318; text-decoration: underline">Eliminar</button>
            </div>
          </article>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { def: 1, ask: null, form: false, msg: '2 direcciones guardadas', list: [
      { id: 1, name: 'Casa', line1: 'Hidalgo 210, Centro', line2: 'Toluca, Estado de México · CP 50000' },
      { id: 2, name: 'Obra Metepec', line1: 'Av. Ejemplo 88, San Jerónimo', line2: 'Metepec, Estado de México · CP 52140' }
    ] };
  }
  renderVals() {
    const N = [['Resumen', 'Escritorio-14-MiCuenta.dc.html'], ['Mis pedidos', 'Escritorio-15-Pedidos.dc.html'], ['Direcciones', 'Escritorio-17-Direcciones.dc.html'], ['Lista de deseos', 'Escritorio-18-ListaDeseos.dc.html'], ['Datos y privacidad', 'Escritorio-19-Datos.dc.html'], ['Cerrar sesión', 'Escritorio-6-Inicio.dc.html']];
    const s = this.state;
    return {
      nav: N.map(([label, href], i) => ({ label, href, cur: i === 2 ? 'page' : 'false', bg: i === 2 ? '#15181B' : '#FFFFFF', fg: i === 2 ? '#FFFFFF' : '#15181B', w: i === 2 ? '600' : '400' })),
      msg: s.msg, showForm: s.form, formOpen: s.form ? 'true' : 'false',
      toggleForm: () => this.setState({ form: !this.state.form }),
      addrs: s.list.map(a => ({
        ...a, def: a.id === s.def, notDef: a.id !== s.def, asking: a.id === s.ask,
        border: a.id === s.def ? '2px solid #C2410C' : '1px solid #FFFFFF',
        makeDef: () => this.setState({ def: a.id, msg: '"' + a.name + '" es ahora tu dirección principal' }),
        ask: () => this.setState({ ask: a.id }),
        cancel: () => this.setState({ ask: null }),
        remove: () => this.setState({ ask: null, list: this.state.list.filter(x => x.id !== a.id), msg: 'Eliminamos "' + a.name + '"' })
      }))
    };
  }
}
</script>
</body>
</html>
