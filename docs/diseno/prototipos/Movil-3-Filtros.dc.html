<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Filtros en móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#15181B}a:hover{color:#C2410C}
:focus-visible{outline:3px solid #F26B2A;outline-offset:2px}
summary{list-style:none}summary::-webkit-details-marker{display:none}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="ft" style="width: 390px; height: 1200px; position: relative; background: #FFFFFF; color: #15181B; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 16px; border-bottom: 1px solid #D3D8DD">
    <h1 id="ft" style="margin: 0; flex: 1; font-family: 'Barlow Condensed', sans-serif; font-size: 30px; text-transform: uppercase">Filtros</h1>
    <a href="Movil-1-Listado.dc.html" aria-label="Cerrar filtros" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 12px 16px 120px; display: flex; flex-direction: column; gap: 4px">
    <p aria-live="polite" style="margin: 0 0 6px; font-size: 14px; color: #4E5862">Filtrado por: precio hasta $5,000 y mandril de 3/8 a 1/2 pulg. 2 filtros activos</p>

    <details open style="border-bottom: 1px solid #E3E7EA">
      <summary style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; cursor: pointer">Precio <span style="font-weight: 400; color: #4E5862">Hasta $5,000</span></summary>
      <div style="display: flex; gap: 10px; padding-bottom: 14px">
        <label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: #4E5862">Mínimo<input type="text" inputmode="numeric" value="$0" style="height: 48px; border: 1px solid #B9C1C8; border-radius: 4px; padding: 0 10px; font: inherit; font-size: 16px; color: #15181B; min-width: 0"></label>
        <label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: #4E5862">Máximo<input type="text" inputmode="numeric" value="$5,000" style="height: 48px; border: 1px solid #B9C1C8; border-radius: 4px; padding: 0 10px; font: inherit; font-size: 16px; color: #15181B; min-width: 0"></label>
      </div>
    </details>

    <details open style="border-bottom: 1px solid #E3E7EA">
      <summary style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; cursor: pointer">Mandril <span style="font-weight: 400; color: #4E5862">2 seleccionados</span></summary>
      <div role="group" aria-label="Mandril" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding-bottom: 14px">
        <button type="button" aria-pressed="false" style="min-height: 48px; border: 1px solid #B9C1C8; border-radius: 4px; background: #FFFFFF; font: inherit">1/4 pulg</button>
        <button type="button" aria-pressed="true" style="min-height: 48px; border: 0; border-radius: 4px; background: #15181B; color: #FFFFFF; font: inherit; font-weight: 600">3/8 pulg</button>
        <button type="button" aria-pressed="true" style="min-height: 48px; border: 0; border-radius: 4px; background: #15181B; color: #FFFFFF; font: inherit; font-weight: 600">1/2 pulg</button>
      </div>
    </details>

    <sc-for list="{{facets}}" as="f" hint-placeholder-count="2">
      <details open style="border-bottom: 1px solid #E3E7EA">
        <summary style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; cursor: pointer">{{f.title}}</summary>
        <fieldset style="border: 0; margin: 0; padding: 0 0 10px">
          <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{f.title}}</legend>
          <sc-for list="{{f.opts}}" as="o" hint-placeholder-count="3">
            <label style="min-height: 48px; display: flex; align-items: center; gap: 12px"><input type="checkbox" style="width: 22px; height: 22px; accent-color: #C2410C"> {{o.name}} <span style="margin-left: auto; color: #4E5862">{{o.n}}</span></label>
          </sc-for>
        </fieldset>
      </details>
    </sc-for>

    <details open>
      <summary style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; cursor: pointer">Disponibilidad</summary>
      <fieldset style="border: 0; margin: 0; padding: 0 0 10px">
        <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Disponibilidad</legend>
        <label style="min-height: 48px; display: flex; align-items: center; gap: 12px"><input type="radio" name="dm" style="width: 22px; height: 22px; accent-color: #C2410C"> Recoger hoy en Toluca Centro</label>
        <label style="min-height: 48px; display: flex; align-items: center; gap: 12px"><input type="radio" name="dm" checked style="width: 22px; height: 22px; accent-color: #C2410C"> Envío o recolección</label>
      </fieldset>
    </details>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #D3D8DD; padding: 12px 16px 16px; display: grid; grid-template-columns: 1fr 2fr; gap: 10px">
    <button type="button" style="min-height: 52px; border: 1px solid #15181B; border-radius: 4px; background: #FFFFFF; font: inherit; font-weight: 600">Limpiar</button>
    <a href="Movil-1-Listado.dc.html" style="min-height: 52px; border-radius: 4px; background: #C2410C; color: #FFFFFF; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Ver 48 resultados</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      facets: [
        { title: 'Marca', opts: [{ name: 'Volta', n: 21 }, { name: 'Brava', n: 14 }, { name: 'Ferro', n: 13 }] },
        { title: 'Alimentación', opts: [{ name: 'Inalámbrico 12 V', n: 9 }, { name: 'Inalámbrico 20 V', n: 18 }, { name: 'Eléctrico 127 V', n: 21 }] }
      ]
    };
  }
}
</script>
</body>
</html>
