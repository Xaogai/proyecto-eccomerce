<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lista de deseos en móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#15181B}a:hover{color:#C2410C}
:focus-visible{outline:3px solid #F26B2A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 1100px; background: #EDEFF1; color: #15181B; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45">
  <header style="background: #15181B; color: #FFFFFF; padding: 8px 10px; display: flex; align-items: center; gap: 4px">
    <a href="Movil-17-MiCuenta.dc.html" aria-label="Volver a Mi cuenta" style="width: 44px; height: 44px; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 style="margin: 0; flex: 1; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; text-transform: uppercase">Lista de deseos</h1>
  </header>
  <main style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <p aria-live="polite" style="margin: 0; color: #4E5862; font-size: 15px">{{msg}}</p>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div style="background: #FFFFFF; border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 8px"><strong>Tu lista está vacía</strong><a href="Movil-1-Listado.dc.html" style="min-height: 48px; border-radius: 4px; background: #C2410C; color: #FFFFFF; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Explorar productos</a></div>
    </sc-if>
    <sc-for list="{{items}}" as="p" hint-placeholder-count="3">
      <article style="background: #FFFFFF; border-radius: 6px; padding: 12px; display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px 12px">
        <div style="height: 88px; background: #F5F6F7; border-radius: 4px; color: #4E5862; display: flex; align-items: center; justify-content: center"><svg width="64" height="48" viewBox="0 0 120 90" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{p.alt}}"><path d="M18 20h60a8 8 0 0 1 8 8v10a8 8 0 0 1-8 8H58l-6 30H34l4-30H18a6 6 0 0 1-6-6V26a6 6 0 0 1 6-6z"/><path d="M86 33h14"/></svg></div>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <a href="Movil-4-Ficha.dc.html" style="font-weight: 600; text-decoration: none; line-height: 1.25">{{p.name}}</a>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.1">{{p.price}} <span style="font-family: Barlow, sans-serif; font-size: 13px; font-weight: 600; color: #1E7A46">{{p.drop}}</span></span>
          <span style="font-size: 13px; font-weight: 600; color: {{p.c}}">{{p.stock}}</span>
        </div>
        <div style="grid-column: 1 / -1; display: grid; grid-template-columns: 2fr 1fr; gap: 8px">
          <a href="{{p.href}}" style="min-height: 46px; border-radius: 4px; background: {{p.bg}}; color: {{p.fg}}; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px">{{p.cta}}</a>
          <button type="button" onClick="{{p.remove}}" style="min-height: 46px; border: 1px solid #B9C1C8; border-radius: 4px; background: #FFFFFF; font: inherit; font-size: 15px">Quitar</button>
        </div>
      </article>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { msg: '3 productos guardados', list: [
    { id: 1, name: 'Rotomartillo SDS Plus 800 W', price: '$2,899', drop: 'Antes $3,199', stock: 'Quedan 3 en Toluca Centro', s: 'low' },
    { id: 2, name: 'Taladro de banco 1/2 HP', price: '$4,590', drop: '', stock: 'Solo envío a domicilio', s: 'ship' },
    { id: 3, name: 'Taladro atornillador compacto 12 V', price: '$1,299', drop: '', stock: 'Agotado en tu sucursal', s: 'out' }
  ] }; }
  renderVals() {
    const C = { low: '#8A5300', ship: '#4E5862', out: '#B42318' };
    const list = this.state.list;
    return {
      msg: this.state.msg, empty: list.length === 0,
      items: list.map(p => ({ ...p, alt: 'Foto de ' + p.name, c: C[p.s],
        cta: p.s === 'out' ? 'Avisarme cuando llegue' : 'Agregar al carrito', href: p.s === 'out' ? '#' : 'Movil-5-Carrito.dc.html',
        bg: p.s === 'out' ? '#E3E7EA' : '#C2410C', fg: p.s === 'out' ? '#15181B' : '#FFFFFF',
        remove: () => { const l = this.state.list.filter(x => x.id !== p.id); this.setState({ list: l, msg: 'Quitamos "' + p.name + '". Quedan ' + l.length }); } }))
    };
  }
}
</script>
</body>
</html>
