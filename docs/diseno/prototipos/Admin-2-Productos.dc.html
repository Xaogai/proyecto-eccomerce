<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Administración, productos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#15181B}a:hover{color:#C2410C}
:focus-visible{outline:3px solid #F26B2A;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 1100px; background: #EDEFF1; color: #15181B; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.45">
  <header style="background: #15181B; color: #FFFFFF">
    <div style="padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700">[MARCA]<span style="color: #F26B2A">.</span> <span style="font-size: 18px; font-weight: 600; color: #C9D0D6; text-transform: uppercase; letter-spacing: .06em">Administración</span></span>
      <span style="flex: 1"></span>
      <span style="color: #C9D0D6">Luis Ramírez · Administrador</span>
    </div>
  </header>
  <div style="padding: 20px 24px 40px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
    <nav aria-label="Administración" style="flex: 1 1 200px; background: #FFFFFF; border-radius: 6px; padding: 8px; display: flex; flex-direction: column">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
        <a href="{{n.href}}" aria-current="{{n.cur}}" style="min-height: 44px; padding: 0 12px; border-radius: 4px; text-decoration: none; display: flex; align-items: center; background: {{n.bg}}; color: {{n.fg}}; font-weight: {{n.w}}">{{n.label}}</a>
      </sc-for>
    </nav>
    <main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
        <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 44px; line-height: 1; text-transform: uppercase">Productos</h1>
        <div style="display: flex; gap: 8px">
          <button type="button" style="min-height: 46px; padding: 0 16px; border: 1px solid #15181B; border-radius: 4px; background: #FFFFFF; font: inherit; font-weight: 600">Importar CSV</button>
          <a href="Admin-3-Producto.dc.html" style="min-height: 46px; padding: 0 18px; border-radius: 4px; background: #C2410C; color: #FFFFFF; font-weight: 600; text-decoration: none; display: flex; align-items: center">Nuevo producto</a>
        </div>
      </div>
      <div style="background: #FFFFFF; border-radius: 6px; padding: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end">
        <label style="flex: 2 1 240px; display: flex; flex-direction: column; gap: 4px; font-weight: 600">Buscar<input type="search" placeholder="Nombre o SKU" style="height: 44px; border: 1px solid #B9C1C8; border-radius: 4px; padding: 0 10px; font: inherit; font-weight: 400"></label>
        <label style="flex: 1 1 180px; display: flex; flex-direction: column; gap: 4px; font-weight: 600">Categoría<select style="height: 44px; border: 1px solid #B9C1C8; border-radius: 4px; padding: 0 8px; font: inherit; font-weight: 400; background: #FFFFFF"><option>Todas</option><option>Herramientas › Eléctricas › Taladros</option><option>Ferretería › Fijación</option></select></label>
        <div role="group" aria-label="Estado" style="display: flex; gap: 6px; flex-wrap: wrap">
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
            <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="min-height: 44px; padding: 0 12px; border-radius: 4px; border: 1px solid #15181B; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-weight: 600">{{c.label}}</button>
          </sc-for>
        </div>
      </div>
      <p aria-live="polite" style="margin: 0; color: #4E5862">{{countText}}</p>
      <div style="overflow-x: auto; background: #FFFFFF; border-radius: 6px">
        <table style="width: 100%; min-width: 820px; border-collapse: collapse">
          <thead><tr style="text-align: left; background: #F5F6F7; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #4E5862">
            <th scope="col" style="padding: 10px 12px; width: 32px"><input type="checkbox" aria-label="Seleccionar todos" style="width: 18px; height: 18px"></th>
            <th scope="col" style="padding: 10px 12px">Producto</th><th scope="col" style="padding: 10px 12px">Categoría</th><th scope="col" style="padding: 10px 12px">Variantes</th><th scope="col" style="padding: 10px 12px">Precio desde</th><th scope="col" style="padding: 10px 12px">Stock total</th><th scope="col" style="padding: 10px 12px">Estado</th><th scope="col" style="padding: 10px 12px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Acciones</span></th>
          </tr></thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
              <tr style="border-top: 1px solid #E3E7EA">
                <td style="padding: 10px 12px"><input type="checkbox" aria-label="Seleccionar {{r.name}}" style="width: 18px; height: 18px"></td>
                <td style="padding: 10px 12px"><a href="Admin-3-Producto.dc.html" style="font-weight: 600; text-decoration: none">{{r.name}}</a><br><span style="font-size: 13px; color: #4E5862">{{r.sku}}</span></td>
                <td style="padding: 10px 12px; color: #4E5862">{{r.cat}}</td>
                <td style="padding: 10px 12px; font-variant-numeric: tabular-nums">{{r.v}}</td>
                <td style="padding: 10px 12px; font-variant-numeric: tabular-nums">{{r.price}}</td>
                <td style="padding: 10px 12px; font-variant-numeric: tabular-nums; font-weight: {{r.sw}}; color: {{r.sc}}">{{r.stock}}</td>
                <td style="padding: 10px 12px"><span style="font-size: 13px; font-weight: 600; padding: 3px 8px; border-radius: 4px; background: {{r.bg}}; color: {{r.fg}}">{{r.status}}</span></td>
                <td style="padding: 10px 12px"><a href="Admin-3-Producto.dc.html" style="font-weight: 600">Editar</a></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'todos' }; }
  renderVals() {
    const N = [['Resumen', 'Admin-1-Resumen.dc.html'], ['Productos', 'Admin-2-Productos.dc.html'], ['Categorías', 'Admin-4-Categorias.dc.html'], ['Pedidos', 'Admin-5-Pedidos.dc.html'], ['Usuarios y roles', 'Admin-7-Usuarios.dc.html'], ['Reportes', 'Admin-8-Reportes.dc.html'], ['Configuración', 'Admin-9-Configuracion.dc.html']];
    const S = { pub: ['Publicado', '#E2F1E8', '#1E7A46'], bor: ['Borrador', '#E6EAEE', '#3F4851'], ago: ['Agotado', '#FBE6E4', '#B42318'] };
    const R = [
      ['Taladro percutor inalámbrico 1/2 pulg 20 V', 'SKU 100245', 'Eléctricas › Taladros', 3, '$2,149', '22', 'pub'],
      ['Kit taladro y atornillador 20 V', 'SKU 100311', 'Eléctricas › Taladros', 2, '$3,499', '15', 'pub'],
      ['Rotomartillo SDS Plus 800 W', 'SKU 200118', 'Eléctricas › Rotomartillos', 1, '$2,899', '9', 'pub'],
      ['Taladro atornillador compacto 12 V', 'SKU 100402', 'Eléctricas › Taladros', 2, '$1,299', '0', 'ago'],
      ['Taladro eléctrico 3/8 pulg 600 W', 'SKU 300077', 'Eléctricas › Taladros', 1, '$849', '47', 'pub'],
      ['Taladro magnético 1,100 W', 'SKU 300301', 'Eléctricas › Taladros', 0, 'Sin precio', '—', 'bor'],
      ['Juego de brocas para concreto, 5 piezas', 'SKU 410032', 'Accesorios › Brocas', 1, '$219', '84', 'pub']
    ];
    const f = this.state.f;
    const rows = R.filter(r => f === 'todos' || r[6] === f);
    const cur = 1;
    return {
      nav: N.map(([label, href], i) => ({ label, href, cur: i === cur ? 'page' : 'false', bg: i === cur ? '#15181B' : '#FFFFFF', fg: i === cur ? '#FFFFFF' : '#15181B', w: i === cur ? '600' : '400' })),
      chips: [['todos', 'Todos'], ['pub', 'Publicados'], ['bor', 'Borradores'], ['ago', 'Agotados']].map(([k, label]) => ({ label, on: f === k ? 'true' : 'false', bg: f === k ? '#15181B' : '#FFFFFF', fg: f === k ? '#FFFFFF' : '#15181B', pick: () => this.setState({ f: k }) })),
      countText: rows.length + ' productos de ejemplo',
      rows: rows.map(r => ({ name: r[0], sku: r[1], cat: r[2], v: r[3], price: r[4], stock: r[5], status: S[r[6]][0], bg: S[r[6]][1], fg: S[r[6]][2], sw: r[5] === '0' ? '600' : '400', sc: r[5] === '0' ? '#B42318' : '#15181B' }))
    };
  }
}
</script>
</body>
</html>
