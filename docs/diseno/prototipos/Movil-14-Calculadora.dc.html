<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Calculadora en móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#15181B}a:hover{color:#C2410C}
:focus-visible{outline:3px solid #F26B2A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 1300px; background: #EDEFF1; color: #15181B; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45">
  <header style="background: #15181B; color: #FFFFFF; padding: 8px 10px; display: flex; align-items: center; gap: 4px">
    <a href="Movil-9-Inicio.dc.html" aria-label="Volver" style="width: 44px; height: 44px; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 style="margin: 0; flex: 1; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; text-transform: uppercase">Calculadora</h1>
  </header>
  <main style="padding: 14px 16px; display: flex; flex-direction: column; gap: 14px">
    <div role="tablist" aria-label="Tipo de cálculo" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <button type="button" role="tab" aria-selected="true" style="min-height: 46px; border: 0; border-radius: 4px; background: #15181B; color: #FFFFFF; font: inherit; font-weight: 600">Pintura</button>
      <button type="button" role="tab" aria-selected="false" style="min-height: 46px; border: 1px solid #B9C1C8; border-radius: 4px; background: #FFFFFF; font: inherit">Piso</button>
      <button type="button" role="tab" aria-selected="false" style="min-height: 46px; border: 1px solid #B9C1C8; border-radius: 4px; background: #FFFFFF; font: inherit">Taquetes</button>
    </div>
    <form novalidate role="tabpanel" aria-label="Pintura" style="background: #FFFFFF; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="{{f.id}}" style="font-weight: 600">{{f.label}}</label>
          <input id="{{f.id}}" type="text" inputmode="decimal" value="{{f.value}}" onInput="{{f.set}}" aria-invalid="{{f.invalid}}" aria-describedby="{{f.hid}}" style="height: 50px; border: {{f.border}}; border-radius: 4px; padding: 0 12px; font: inherit">
          <span id="{{f.hid}}" style="font-size: 14px; font-weight: {{f.hw}}; color: {{f.hc}}">{{f.help}}</span>
        </div>
      </sc-for>
      <label style="display: flex; flex-direction: column; gap: 4px; font-weight: 600">Manos de pintura
        <select onChange="{{setManos}}" style="height: 50px; border: 1px solid #B9C1C8; border-radius: 4px; padding: 0 10px; font: inherit; font-weight: 400; background: #FFFFFF"><option value="1">1 mano</option><option value="2" selected>2 manos</option><option value="3">3 manos</option></select>
      </label>
      <p style="margin: 0; font-size: 14px; color: #4E5862">Rendimiento estimado: 10 m² por litro por mano. Revisa la etiqueta.</p>
    </form>
    <section aria-live="polite" style="background: #15181B; color: #FFFFFF; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
      <sc-if value="{{valid}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between"><span style="color: #C9D0D6">Superficie</span><strong>{{area}} m²</strong></div>
          <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="color: #C9D0D6">Necesitas</span><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1">{{litros}} L</span></div>
          <span style="color: #C9D0D6">Sugerencia: {{sugerencia}}</span>
          <a href="Movil-5-Carrito.dc.html" style="min-height: 50px; border-radius: 4px; background: #C2410C; color: #FFFFFF; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Agregar sugerencia al carrito</a>
        </div>
      </sc-if>
      <sc-if value="{{invalid}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; color: #FFB4A8; font-weight: 600">Corrige los campos marcados para ver el resultado.</p>
      </sc-if>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { ancho: '4', alto: '2.5', muros: '', desc: '3', manos: 2 }; }
  renderVals() {
    const s = this.state;
    const num = v => { const n = Number(String(v).replace(',', '.')); return v !== '' && isFinite(n) && n >= 0 ? n : null; };
    const defs = [
      { id: 'ancho', label: 'Ancho de cada muro (m)', help: 'Ejemplo: 4', min: 0.1 },
      { id: 'alto', label: 'Alto de cada muro (m)', help: 'Ejemplo: 2.5', min: 0.1 },
      { id: 'muros', label: 'Número de muros', help: 'Solo los que vas a pintar', min: 1 },
      { id: 'desc', label: 'Puertas y ventanas (m²)', help: 'Escribe 0 si no hay', min: 0 }
    ];
    let ok = true; const vals = {};
    const fields = defs.map(d => {
      const n = num(s[d.id]); const bad = n === null || n < d.min;
      if (bad) ok = false; else vals[d.id] = n;
      return { id: 'm' + d.id, hid: 'm' + d.id + '-ayuda', label: d.label, value: s[d.id], invalid: bad ? 'true' : 'false',
        border: bad ? '2px solid #B42318' : '1px solid #B9C1C8',
        help: bad ? (s[d.id] === '' ? 'Este campo es obligatorio.' : 'Escribe un número válido, mínimo ' + d.min + '.') : d.help,
        hc: bad ? '#B42318' : '#4E5862', hw: bad ? '600' : '400', set: e => this.setState({ [d.id]: e.target.value }) };
    });
    let area = 0, litros = 0, sugerencia = '';
    if (ok) {
      area = Math.max(0, vals.ancho * vals.alto * vals.muros - vals.desc);
      litros = Math.ceil(area * s.manos / 10 * 10) / 10;
      const cub = Math.floor(litros / 19), gal = Math.ceil((litros - cub * 19) / 4);
      const parts = [];
      if (cub) parts.push(cub + (cub > 1 ? ' cubetas' : ' cubeta') + ' de 19 L');
      if (gal) parts.push(gal + (gal > 1 ? ' galones' : ' galón') + ' de 4 L');
      sugerencia = parts.join(' y ') || 'no necesitas pintura';
    }
    return { fields, valid: ok, invalid: !ok, area: area.toFixed(1), litros: litros.toFixed(1), sugerencia, setManos: e => this.setState({ manos: Number(e.target.value) }) };
  }
}
</script>
</body>
</html>
