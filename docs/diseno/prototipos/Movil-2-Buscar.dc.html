<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscar con autocompletado</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#15181B}a:hover{color:#C2410C}
:focus-visible{outline:3px solid #F26B2A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #FFFFFF; color: #15181B; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column">
  <form role="search" style="background: #15181B; padding: 12px 16px; display: flex; align-items: center; gap: 8px">
    <a href="Movil-1-Listado.dc.html" aria-label="Volver" style="width: 44px; height: 44px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <label for="qm" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar productos</label>
    <input id="qm" type="search" value="tala" role="combobox" aria-expanded="true" aria-controls="sug" aria-autocomplete="list" aria-describedby="sug-n" style="flex: 1; min-width: 0; height: 46px; border: 0; border-radius: 4px; padding: 0 12px; font: inherit; font-size: 17px">
    <button type="submit" aria-label="Buscar" style="width: 46px; height: 46px; border: 0; border-radius: 4px; background: #C2410C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
  </form>

  <div style="padding: 8px 0; display: flex; flex-direction: column; flex: 1; overflow: hidden">
    <p id="sug-n" aria-live="polite" style="margin: 0; padding: 4px 16px; font-size: 13px; color: #4E5862">4 sugerencias y 2 productos</p>
    <ul id="sug" style="list-style: none; margin: 0; padding: 0">
      <sc-for list="{{terms}}" as="t" hint-placeholder-count="4">
        <li><a href="Movil-1-Listado.dc.html" style="min-height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; border-bottom: 1px solid #EDEFF1">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4E5862" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <span style="flex: 1"><strong>tala</strong>{{t.rest}}</span>
          <span style="font-size: 13px; color: #4E5862">{{t.where}}</span>
        </a></li>
      </sc-for>
    </ul>
    <h2 style="margin: 0; padding: 18px 16px 8px; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; text-transform: uppercase">Productos</h2>
    <ul style="list-style: none; margin: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{prods}}" as="p" hint-placeholder-count="2">
        <li><a href="Movil-4-Ficha.dc.html" style="display: flex; gap: 12px; align-items: center; text-decoration: none; padding: 8px; border-radius: 6px; background: #F5F6F7; min-height: 64px">
          <span style="width: 56px; height: 56px; background: #FFFFFF; border-radius: 4px; color: #4E5862; display: flex; align-items: center; justify-content: center; flex: none"><svg width="40" height="30" viewBox="0 0 120 90" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 20h60a8 8 0 0 1 8 8v10a8 8 0 0 1-8 8H58l-6 30H34l4-30H18a6 6 0 0 1-6-6V26a6 6 0 0 1 6-6z"/><path d="M86 33h14"/></svg></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 600">{{p.name}}</span><span style="font-size: 13px; color: #1E7A46; font-weight: 600">{{p.stock}}</span></span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700">{{p.price}}</span>
        </a></li>
      </sc-for>
    </ul>
    <h2 style="margin: 0; padding: 18px 16px 8px; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; text-transform: uppercase">Búsquedas recientes</h2>
    <div style="padding: 0 16px; display: flex; flex-wrap: wrap; gap: 8px">
      <a href="#" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #B9C1C8; text-decoration: none; display: flex; align-items: center">taquetes 1/4</a>
      <a href="#" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #B9C1C8; text-decoration: none; display: flex; align-items: center">pintura vinílica</a>
      <a href="#" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #B9C1C8; text-decoration: none; display: flex; align-items: center">SKU 410032</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      terms: [
        { rest: 'dro', where: 'Herramientas eléctricas' },
        { rest: 'dro inalámbrico 20 V', where: '18 productos' },
        { rest: 'dro percutor', where: '12 productos' },
        { rest: 'dro de banco', where: '4 productos' }
      ],
      prods: [
        { name: 'Taladro percutor inalámbrico 20 V', price: '$2,149', stock: '12 en Toluca Centro' },
        { name: 'Taladro eléctrico 3/8 pulg 600 W', price: '$849', stock: '20 en Toluca Centro' }
      ]
    };
  }
}
</script>
</body>
</html>
