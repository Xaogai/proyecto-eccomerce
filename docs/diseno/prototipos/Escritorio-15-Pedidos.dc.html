<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mis pedidos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#15181B}a:hover{color:#C2410C}
:focus-visible{outline:3px solid #F26B2A;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 1100px; background: #EDEFF1; color: #15181B; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.45">
  <header style="background: #15181B; color: #FFFFFF">
    <div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
      <a href="Escritorio-6-Inicio.dc.html" style="font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 700; color: #FFFFFF; text-decoration: none">[MARCA]<span style="color: #F26B2A">.</span></a>
      <span style="flex: 1"></span>
      <span style="color: #C9D0D6">Toluca Centro · CP 50000</span>
      <a href="Escritorio-14-MiCuenta.dc.html" style="color: #FFFFFF; min-height: 44px; display: flex; align-items: center">Hola, Ana</a>
      <a href="Escritorio-3-Carrito.dc.html" style="color: #FFFFFF; min-height: 44px; display: flex; align-items: center">Carrito (3)</a>
    </div>
  </header>
  <div style="max-width: 1200px; margin: 0 auto; padding: 24px 24px 48px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
    <nav aria-label="Mi cuenta" style="flex: 1 1 220px; background: #FFFFFF; border-radius: 6px; padding: 8px; display: flex; flex-direction: column">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
        <a href="{{n.href}}" aria-current="{{n.cur}}" style="min-height: 46px; padding: 0 14px; border-radius: 4px; text-decoration: none; display: flex; align-items: center; background: {{n.bg}}; color: {{n.fg}}; font-weight: {{n.w}}">{{n.label}}</a>
      </sc-for>
    </nav>
    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 48px; line-height: 1; text-transform: uppercase">Mis pedidos</h1>
      <div role="group" aria-label="Filtrar por estado" style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
          <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #15181B; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-weight: 600">{{c.label}}</button>
        </sc-for>
      </div>
      <p aria-live="polite" style="margin: 0; color: #4E5862">{{countText}}</p>
      <sc-for list="{{orders}}" as="o" hint-placeholder-count="5">
        <article style="background: #FFFFFF; border-radius: 6px; padding: 18px 20px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center">
          <div style="flex: 2 1 260px; display: flex; flex-direction: column; gap: 2px">
            <a href="Escritorio-16-Seguimiento.dc.html" style="font-weight: 600; font-size: 17px; text-decoration: none">Pedido {{o.id}}</a>
            <span style="color: #4E5862">{{o.date}} · {{o.items}}</span>
            <span style="color: #4E5862">{{o.how}}</span>
          </div>
          <span style="flex: 1 1 100px; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700">{{o.total}}</span>
          <span style="font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 4px; background: {{o.bg}}; color: {{o.fg}}">{{o.status}}</span>
          <a href="Escritorio-16-Seguimiento.dc.html" style="min-height: 44px; padding: 0 16px; border-radius: 4px; border: 1px solid #15181B; font-weight: 600; text-decoration: none; display: flex; align-items: center">Ver detalle</a>
        </article>
      </sc-for>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'todos' }; }
  renderVals() {
    const N = [['Resumen', 'Escritorio-14-MiCuenta.dc.html'], ['Mis pedidos', 'Escritorio-15-Pedidos.dc.html'], ['Direcciones', 'Escritorio-17-Direcciones.dc.html'], ['Lista de deseos', 'Escritorio-18-ListaDeseos.dc.html'], ['Datos y privacidad', 'Escritorio-19-Datos.dc.html'], ['Cerrar sesión', 'Escritorio-6-Inicio.dc.html']];
    const S = {
      listo: ['Listo para recoger', '#FBEFD6', '#6B4100', 'curso'], env: ['Enviado', '#E1E9F5', '#1D4480', 'curso'],
      ent: ['Entregado', '#E2F1E8', '#1E7A46', 'fin'], dev: ['Reembolsado', '#E6EAEE', '#3F4851', 'fin'], can: ['Cancelado', '#FBE6E4', '#B42318', 'fin']
    };
    const O = [
      { id: '10482', date: '16 oct 2026', items: '2 productos', how: 'Recoger en Toluca Centro', total: '$3,337', s: 'listo' },
      { id: '10450', date: '12 oct 2026', items: '1 producto', how: 'Envío a Hidalgo 210 · guía MX123456789', total: '$998', s: 'env' },
      { id: '10311', date: '2 oct 2026', items: '3 productos', how: 'Recoger en Metepec', total: '$1,048', s: 'ent' },
      { id: '10107', date: '14 sep 2026', items: '1 producto', how: 'Devolución aprobada el 20 sep', total: '$429', s: 'dev' },
      { id: '10044', date: '3 sep 2026', items: '1 producto', how: 'Cancelado por ti antes del pago', total: '$219', s: 'can' }
    ];
    const f = this.state.f;
    const list = O.filter(o => f === 'todos' || S[o.s][3] === f);
    const C = [['todos', 'Todos'], ['curso', 'En curso'], ['fin', 'Terminados']];
    return {
      nav: N.map(([label, href], i) => ({ label, href, cur: i === 1 ? 'page' : 'false', bg: i === 1 ? '#15181B' : '#FFFFFF', fg: i === 1 ? '#FFFFFF' : '#15181B', w: i === 1 ? '600' : '400' })),
      chips: C.map(([k, label]) => ({ label, on: f === k ? 'true' : 'false', bg: f === k ? '#15181B' : '#FFFFFF', fg: f === k ? '#FFFFFF' : '#15181B', pick: () => this.setState({ f: k }) })),
      countText: list.length + (list.length === 1 ? ' pedido' : ' pedidos'),
      orders: list.map(o => ({ ...o, status: S[o.s][0], bg: S[o.s][1], fg: S[o.s][2] }))
    };
  }
}
</script>
</body>
</html>
