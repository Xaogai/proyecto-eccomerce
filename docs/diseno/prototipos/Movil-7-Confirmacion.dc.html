<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Confirmación en móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#15181B}a:hover{color:#C2410C}
:focus-visible{outline:3px solid #F26B2A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 1100px; background: #EDEFF1; color: #15181B; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45">
  <header style="background: #15181B; color: #FFFFFF; padding: 10px 16px; display: flex; align-items: center; gap: 8px">
    <a href="Movil-1-Listado.dc.html" style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700; color: #FFFFFF; text-decoration: none; flex: 1; min-height: 44px; display: flex; align-items: center">[MARCA]<span style="color: #F26B2A">.</span></a>
    <span style="font-size: 14px; color: #C9D0D6">Toluca Centro</span>
  </header>

  <main style="padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <section role="status" aria-live="polite" style="background: #FFFFFF; border-radius: 6px; padding: 20px 18px; display: flex; flex-direction: column; gap: 8px; border: {{boxBorder}}">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: {{tone}}">{{eyebrow}}</span>
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 36px; line-height: 1.02; text-transform: uppercase">{{title}}</h1>
      <p style="margin: 0">{{msg}}</p>
      <sc-if value="{{isRej}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px">
          <a href="Movil-6-Checkout.dc.html" style="min-height: 52px; border-radius: 4px; background: #C2410C; color: #FFFFFF; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Reintentar el pago</a>
          <a href="Movil-5-Carrito.dc.html" style="min-height: 52px; border-radius: 4px; border: 1px solid #15181B; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Revisar carrito</a>
        </div>
      </sc-if>
    </section>

    <sc-if value="{{showOrder}}" hint-placeholder-val="{{ true }}">
      <section aria-labelledby="pm" style="background: #FFFFFF; border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h2 id="pm" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; text-transform: uppercase">Pedido 10482</h2>
          <span style="font-size: 14px; color: #4E5862">Detalle enviado a ana@ejemplo.com</span>
        </div>
        <ol aria-label="Estado del pedido" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0">
          <sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
            <li aria-current="{{s.cur}}" style="display: flex; gap: 12px; align-items: center; min-height: 40px">
              <span style="width: 14px; height: 14px; border-radius: 50%; background: {{s.dot}}; border: 2px solid {{s.ring}}; flex: none"></span>
              <span style="font-weight: {{s.weight}}; color: {{s.color}}">{{s.name}}</span>
            </li>
          </sc-for>
        </ol>
        <div style="border-top: 1px solid #E3E7EA; padding-top: 12px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13px; color: #4E5862; text-transform: uppercase; letter-spacing: .05em">Recoger en</span>
          <span style="font-weight: 600">Toluca Centro</span>
          <span style="font-size: 15px; color: #4E5862">Lleva tu folio o tu INE</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <span>Total</span><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700">$3,337</span>
        </div>
        <a href="Movil-19-Seguimiento.dc.html" style="min-height: 52px; border-radius: 4px; background: #15181B; color: #FFFFFF; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Ver seguimiento del pedido</a>
        <a href="Movil-1-Listado.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; font-weight: 600">Seguir comprando</a>
      </section>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"estado":{"editor":"enum","options":["pendiente","pagado","rechazado"],"default":"pendiente"},"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const e = this.props.estado ?? 'pendiente';
    const C = {
      pendiente: { eyebrow: 'Pago en proceso', title: 'Estamos confirmando tu pago', msg: 'Tu pedido ya está apartado. Te avisamos por correo en cuanto la pasarela confirme el pago. No vuelvas a pagar.', tone: '#8A5300', border: '2px solid #8A5300', at: 1 },
      pagado: { eyebrow: 'Pago confirmado', title: 'Gracias, tu pedido está pagado', msg: 'Te avisaremos cuando esté listo para recoger en Toluca Centro.', tone: '#1E7A46', border: '2px solid #1E7A46', at: 2 },
      rechazado: { eyebrow: 'Pago rechazado', title: 'Tu banco no aprobó el pago', msg: 'No se hizo ningún cargo. Tus productos siguen apartados 30 minutos: intenta con otra tarjeta o revisa tu carrito.', tone: '#B42318', border: '2px solid #B42318', at: -1 }
    }[e];
    const names = ['Creado', 'Pendiente de pago', 'Pagado', 'En preparación', 'Listo para recoger', 'Entregado'];
    return {
      ...C, boxBorder: C.border,
      isRej: e === 'rechazado', showOrder: e !== 'rechazado',
      steps: names.map((name, i) => ({
        name,
        cur: i === C.at ? 'step' : 'false',
        dot: i <= C.at ? '#C2410C' : '#FFFFFF',
        ring: i <= C.at ? '#C2410C' : '#8E979F',
        color: i <= C.at ? '#15181B' : '#4E5862',
        weight: i === C.at ? '600' : '400'
      }))
    };
  }
}
</script>
</body>
</html>
