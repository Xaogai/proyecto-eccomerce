<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Escribir reseña en móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#15181B}a:hover{color:#C2410C}
:focus-visible{outline:3px solid #F26B2A;outline-offset:2px}
.star:focus-within{outline:3px solid #F26B2A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 1000px; background: #EDEFF1; color: #15181B; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45">
  <header style="background: #15181B; color: #FFFFFF; padding: 8px 10px; display: flex; align-items: center; gap: 4px">
    <a href="Movil-19-Seguimiento.dc.html" aria-label="Volver al pedido" style="width: 44px; height: 44px; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 style="margin: 0; flex: 1; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; text-transform: uppercase">Escribir reseña</h1>
  </header>
  <main style="padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
    <strong>Taladro percutor inalámbrico 20 V</strong>
    <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
      <section role="status" style="background: #FFFFFF; border-radius: 6px; padding: 16px; border: 2px solid #1E7A46; display: flex; flex-direction: column; gap: 6px"><strong>Gracias por tu reseña</strong><span style="font-size: 15px">La publicamos en un máximo de 48 horas como "Compra verificada".</span><a href="Movil-4-Ficha.dc.html" style="font-weight: 600">Ver el producto</a></section>
    </sc-if>
    <sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
      <form novalidate style="background: #FFFFFF; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
          <legend style="font-weight: 600; margin-bottom: 4px">Calificación</legend>
          <div style="display: flex; gap: 2px; align-items: center">
            <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
              <label class="star" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 4px">
                <input type="radio" name="estrellas" checked="{{s.on}}" onChange="{{s.pick}}" aria-label="{{s.label}}" style="position: absolute; opacity: 0; width: 1px; height: 1px">
                <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.5l1.3-6.6L2.5 9.3l6.6-.8z" fill="{{s.fill}}" stroke="#8A5300" stroke-width="1.4" stroke-linejoin="round"/></svg>
              </label>
            </sc-for>
          </div>
          <span aria-live="polite" style="font-weight: 600">{{rateText}}</span>
        </fieldset>
        <label style="display: flex; flex-direction: column; gap: 4px; font-weight: 600">Título<input type="text" value="Potente y ligero" style="height: 50px; border: 1px solid #B9C1C8; border-radius: 4px; padding: 0 12px; font: inherit; font-weight: 400"></label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-weight: 600">Tu opinión<textarea rows="5" style="border: 1px solid #B9C1C8; border-radius: 4px; padding: 10px 12px; font: inherit; font-weight: 400">Lo usé en muro de concreto. La batería me duró toda la tarde.</textarea><span style="font-size: 14px; font-weight: 400; color: #4E5862">Mínimo 20 caracteres</span></label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-weight: 600">Fotos (opcional)<input type="file" accept="image/*" multiple style="font: inherit; font-weight: 400"></label>
        <button type="button" onClick="{{send}}" style="min-height: 52px; border: 0; border-radius: 4px; background: #C2410C; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 17px">Publicar reseña</button>
      </form>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { n: 4, sent: false }; }
  renderVals() {
    const n = this.state.n, L = ['Muy malo', 'Malo', 'Regular', 'Bueno', 'Excelente'];
    return { sent: this.state.sent, editing: !this.state.sent,
      stars: L.map((t, i) => ({ on: i + 1 === n, label: (i + 1) + ' de 5 estrellas, ' + t, fill: i < n ? '#F2A33A' : '#FFFFFF', pick: () => this.setState({ n: i + 1 }) })),
      rateText: n + ' de 5 · ' + L[n - 1], send: () => this.setState({ sent: true }) };
  }
}
</script>
</body>
</html>
