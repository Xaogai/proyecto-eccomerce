<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Administración, pedidos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#15181B}a:hover{color:#C2410C}
:focus-visible{outline:3px solid #F26B2A;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 1050px; background: #EDEFF1; color: #15181B; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.45">
  <header style="background: #15181B; color: #FFFFFF">
    <div style="padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700">[MARCA]<span style="color: #F26B2A">.</span> <span style="font-size: 18px; font-weight: 600; color: #C9D0D6; text-transform: uppercase; letter-spacing: .06em">Administración</span></span>
      <span style="flex: 1"></span>
      <span style="color: #C9D0D6">Luis Ramírez · Administrador</span>
    </div>
  </header>
  <div style="padding: 20px 24px 40px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
    <nav aria-label="Administración" style="flex: 1 1 200px; background: #FFFFFF; border-radius: 6px; padding: 8px; display: flex; flex-direction: column">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
        <a href="{{n.href}}" aria-current="{{n.cur}}" style="min-height: 44px; padding: 0 12px; border-radius: 4px; text-decoration: none; display: flex; align-items: center; background: {{n.bg}}; color: {{n.fg}}; font-weight: {{n.w}}">{{n.label}}</a>
      </sc-for>
    </nav>
    <main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 44px; line-height: 1; text-transform: uppercase">Pedidos</h1>
      <div style="background: #FFFFFF; border-radius: 6px; padding: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end">
        <label style="flex: 2 1 220px; display: flex; flex-direction: column; gap: 4px; font-weight: 600">Buscar<input type="search" placeholder="Folio, cliente o correo" style="height: 44px; border: 1px solid #B9C1C8; border-radius: 4px; padding: 0 10px; font: inherit; font-weight: 400"></label>
        <label style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 4px; font-weight: 600">Sucursal<select style="height: 44px; border: 1px solid #B9C1C8; border-radius: 4px; padding: 0 8px; font: inherit; font-weight: 400; background: #FFFFFF"><option>Todas</option><option>Toluca Centro</option><option>Metepec</option><option>Lerma</option></select></label>
        <label style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 4px; font-weight: 600">Fecha<select style="height: 44px; border: 1px solid #B9C1C8; border-radius: 4px; padding: 0 8px; font: inherit; font-weight: 400; background: #FFFFFF"><option>Hoy</option><option>Últimos 7 días</option><option>Este mes</option></select></label>
      </div>
      <div role="group" aria-label="Estado" style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
          <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #15181B; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-weight: 600">{{c.label}} <span style="font-variant-numeric: tabular-nums">{{c.n}}</span></button>
        </sc-for>
      </div>
      <div style="overflow-x: auto; background: #FFFFFF; border-radius: 6px">
        <table style="width: 100%; min-width: 820px; border-collapse: collapse">
          <thead><tr style="text-align: left; background: #F5F6F7; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #4E5862"><th scope="col" style="padding: 10px 12px">Folio</th><th scope="col" style="padding: 10px 12px">Cliente</th><th scope="col" style="padding: 10px 12px">Entrega</th><th scope="col" style="padding: 10px 12px">Hora</th><th scope="col" style="padding: 10px 12px">Total</th><th scope="col" style="padding: 10px 12px">Estado</th><th scope="col" style="padding: 10px 12px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ver</span></th></tr></thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
              <tr style="border-top: 1px solid #E3E7EA">
                <td style="padding: 10px 12px; font-weight: 600; font-variant-numeric: tabular-nums">{{r.id}}</td>
                <td style="padding: 10px 12px">{{r.who}}</td>
                <td style="padding: 10px 12px; color: #4E5862">{{r.how}}</td>
                <td style="padding: 10px 12px; font-variant-numeric: tabular-nums">{{r.t}}</td>
                <td style="padding: 10px 12px; font-variant-numeric: tabular-nums">{{r.total}}</td>
                <td style="padding: 10px 12px"><span style="font-size: 13px; font-weight: 600; padding: 3px 8px; border-radius: 4px; background: {{r.bg}}; color: {{r.fg}}; white-space: nowrap">{{r.status}}</span></td>
                <td style="padding: 10px 12px"><a href="Admin-6-Pedido.dc.html" style="font-weight: 600">Abrir</a></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1050}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'todos' }; }
  renderVals() {
    const N = [['Resumen', 'Admin-1-Resumen.dc.html'], ['Productos', 'Admin-2-Productos.dc.html'], ['Categorías', 'Admin-4-Categorias.dc.html'], ['Pedidos', 'Admin-5-Pedidos.dc.html'], ['Usuarios y roles', 'Admin-7-Usuarios.dc.html'], ['Reportes', 'Admin-8-Reportes.dc.html'], ['Configuración', 'Admin-9-Configuracion.dc.html']];
    const S = {
      pend: ['Pendiente de pago', '#FBEFD6', '#6B4100'], pag: ['Pagado', '#E1E9F5', '#1D4480'], prep: ['En preparación', '#E1E9F5', '#1D4480'],
      listo: ['Listo para recoger', '#FBEFD6', '#6B4100'], env: ['Enviado', '#E1E9F5', '#1D4480'], inc: ['Incidencia', '#FBE6E4', '#B42318'],
      ent: ['Entregado', '#E2F1E8', '#1E7A46'], can: ['Cancelado', '#E6EAEE', '#3F4851']
    };
    const R = [
      ['10483', 'Jorge M.', 'Envío · CP 52140', '20:12', '$1,890', 'pend'],
      ['10482', 'Ana L.', 'Recoger · Toluca Centro', '18:02', '$3,337', 'listo'],
      ['10481', 'Rosa P.', 'Recoger · Metepec', '17:40', '$612', 'prep'],
      ['10480', 'Carlos V.', 'Envío · CP 50120', '17:15', '$4,590', 'pag'],
      ['10479', 'Martha G.', 'Recoger · Toluca Centro', '16:58', '$219', 'pag'],
      ['10477', 'Luis H.', 'Envío · CP 50000', '14:30', '$2,899', 'inc'],
      ['10470', 'Diana S.', 'Envío · CP 52000', '11:05', '$998', 'env'],
      ['10462', 'Pedro A.', 'Recoger · Lerma', '09:20', '$1,048', 'ent']
    ];
    const groups = { todos: null, pago: ['pend'], prep: ['pag', 'prep'], listos: ['listo', 'env'], inc: ['inc'], fin: ['ent', 'can'] };
    const f = this.state.f;
    const match = r => !groups[f] || groups[f].includes(r[5]);
    const C = [['todos', 'Todos'], ['pago', 'Esperando pago'], ['prep', 'Por preparar'], ['listos', 'Listos o enviados'], ['inc', 'Incidencias'], ['fin', 'Terminados']];
    return {
      nav: N.map(([label, href], i) => ({ label, href, cur: i === 3 ? 'page' : 'false', bg: i === 3 ? '#15181B' : '#FFFFFF', fg: i === 3 ? '#FFFFFF' : '#15181B', w: i === 3 ? '600' : '400' })),
      chips: C.map(([k, label]) => ({ label, n: R.filter(r => !groups[k] || groups[k].includes(r[5])).length, on: f === k ? 'true' : 'false', bg: f === k ? '#15181B' : '#FFFFFF', fg: f === k ? '#FFFFFF' : '#15181B', pick: () => this.setState({ f: k }) })),
      rows: R.filter(match).map(r => ({ id: r[0], who: r[1], how: r[2], t: r[3], total: r[4], status: S[r[5]][0], bg: S[r[5]][1], fg: S[r[5]][2] }))
    };
  }
}
</script>
</body>
</html>
