<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi cuenta en móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#15181B}a:hover{color:#C2410C}
:focus-visible{outline:3px solid #F26B2A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 1000px; background: #EDEFF1; color: #15181B; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45">
  <header style="background: #15181B; color: #FFFFFF; padding: 8px 10px; display: flex; align-items: center; gap: 4px">
    <a href="Movil-9-Inicio.dc.html" aria-label="Volver al inicio" style="width: 44px; height: 44px; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 style="margin: 0; flex: 1; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; text-transform: uppercase">Hola, Ana</h1>
  </header>
  <main style="padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
    <a href="Movil-19-Seguimiento.dc.html" style="background: #15181B; color: #FFFFFF; border-radius: 6px; padding: 16px; text-decoration: none; display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #F26B2A">Pedido en curso</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700">10482 · Listo para recoger</span>
      <span style="color: #C9D0D6; font-size: 15px">Toluca Centro, hasta el 23 de octubre</span>
      <span style="font-weight: 600; color: #FFFFFF">Ver seguimiento ›</span>
    </a>
    <nav aria-label="Mi cuenta" style="background: #FFFFFF; border-radius: 6px; display: flex; flex-direction: column">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
        <a href="{{n.href}}" style="min-height: 60px; padding: 0 16px; border-bottom: 1px solid #EDEFF1; text-decoration: none; display: flex; align-items: center; justify-content: space-between; gap: 10px">
          <span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 600">{{n.label}}</span><span style="font-size: 14px; color: #4E5862">{{n.sub}}</span></span><span aria-hidden="true" style="color: #4E5862">›</span>
        </a>
      </sc-for>
    </nav>
    <a href="Movil-9-Inicio.dc.html" style="min-height: 50px; border-radius: 4px; border: 1px solid #15181B; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Cerrar sesión</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return { nav: [
      { label: 'Mis pedidos', sub: '4 pedidos · 1 en curso', href: 'Movil-18-Pedidos.dc.html' },
      { label: 'Direcciones', sub: '2 guardadas', href: 'Movil-20-Direcciones.dc.html' },
      { label: 'Lista de deseos', sub: '3 productos', href: 'Movil-21-ListaDeseos.dc.html' },
      { label: 'Datos y privacidad', sub: 'Ver, corregir o eliminar tus datos', href: 'Movil-22-Datos.dc.html' },
      { label: 'Mi sucursal', sub: 'Toluca Centro', href: 'Movil-15-Tiendas.dc.html' }
    ] };
  }
}
</script>
</body>
</html>
