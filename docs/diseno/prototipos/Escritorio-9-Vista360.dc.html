<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vista 360 del producto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}
:focus-visible{outline:3px solid #F26B2A;outline-offset:2px}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="v360" style="min-height: 900px; background: #0E1012; color: #FFFFFF; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column">
  <div style="max-width: 1200px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
    <h1 id="v360" style="margin: 0; flex: 1 1 300px; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; text-transform: uppercase">Taladro percutor inalámbrico 20 V</h1>
    <div role="tablist" aria-label="Tipo de vista" style="display: flex; background: #1F2327; border-radius: 4px; padding: 4px; gap: 4px">
      <button type="button" role="tab" aria-selected="false" style="min-height: 40px; padding: 0 14px; border: 0; border-radius: 3px; background: transparent; color: #FFFFFF; font: inherit">Fotos</button>
      <button type="button" role="tab" aria-selected="true" style="min-height: 40px; padding: 0 14px; border: 0; border-radius: 3px; background: #C2410C; color: #FFFFFF; font: inherit; font-weight: 600">Vista 360°</button>
    </div>
    <a href="Escritorio-2-Ficha.dc.html" aria-label="Cerrar vista 360" style="width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: #1F2327"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
  </div>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; color: #C9D0D6">
    <svg width="420" height="315" viewBox="0 0 120 90" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Taladro visto a {{angle}} grados" style="transform: {{tf}}; max-width: 100%"><path d="M18 20h60a8 8 0 0 1 8 8v10a8 8 0 0 1-8 8H58l-6 30H34l4-30H18a6 6 0 0 1-6-6V26a6 6 0 0 1 6-6z"/><path d="M86 33h14"/><path d="M100 30v6l14-3z"/><path d="M30 76h26"/></svg>
  </div>

  <div style="max-width: 760px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 0 24px 32px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <button type="button" onClick="{{left}}" aria-label="Girar a la izquierda" style="width: 50px; height: 50px; border: 0; border-radius: 4px; background: #1F2327; color: #FFFFFF; font: inherit; font-size: 22px">‹</button>
      <label for="ang" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ángulo de giro</label>
      <input id="ang" type="range" min="0" max="345" step="15" value="{{angle}}" onInput="{{slide}}" aria-valuetext="{{angle}} grados" style="flex: 1; accent-color: #C2410C">
      <button type="button" onClick="{{right}}" aria-label="Girar a la derecha" style="width: 50px; height: 50px; border: 0; border-radius: 4px; background: #1F2327; color: #FFFFFF; font: inherit; font-size: 22px">›</button>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 14px; color: #B7C0C8">
      <span aria-live="polite">Vista a {{angle}}°</span>
      <span>Arrastra la barra o usa las flechas del teclado</span>
    </div>
    <div style="display: flex; justify-content: center; gap: 8px">
      <button type="button" aria-label="Alejar" style="width: 46px; height: 46px; border: 0; border-radius: 4px; background: #1F2327; color: #FFFFFF; font: inherit; font-size: 20px">−</button>
      <button type="button" aria-label="Acercar" style="width: 46px; height: 46px; border: 0; border-radius: 4px; background: #1F2327; color: #FFFFFF; font: inherit; font-size: 20px">+</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { a: 45 }; }
  renderVals() {
    const a = this.state.a;
    const set = v => this.setState({ a: ((v % 360) + 360) % 360 });
    const flip = a > 90 && a < 270 ? -1 : 1;
    const squash = Math.max(0.35, Math.abs(Math.cos(a * Math.PI / 180)));
    return {
      angle: a,
      tf: 'scaleX(' + (flip * squash).toFixed(2) + ')',
      left: () => set(a - 15),
      right: () => set(a + 15),
      slide: e => set(Number(e.target.value))
    };
  }
}
</script>
</body>
</html>
