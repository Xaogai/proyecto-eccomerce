<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Comparador en móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#15181B}a:hover{color:#C2410C}
:focus-visible{outline:3px solid #F26B2A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 1000px; background: #EDEFF1; color: #15181B; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.4">
  <header style="background: #15181B; color: #FFFFFF; padding: 8px 10px; display: flex; align-items: center; gap: 4px">
    <a href="Movil-1-Listado.dc.html" aria-label="Volver" style="width: 44px; height: 44px; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 style="margin: 0; flex: 1; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; text-transform: uppercase">Comparar 3</h1>
  </header>
  <main style="padding: 14px 0; display: flex; flex-direction: column; gap: 10px">
    <label style="margin: 0 16px; display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 600"><input type="checkbox" checked="{{only}}" onChange="{{toggle}}" style="width: 22px; height: 22px; accent-color: #C2410C"> Solo diferencias</label>
    <p style="margin: 0 16px; font-size: 14px; color: #4E5862">Desliza la tabla para ver el tercer producto.</p>
    <div style="overflow-x: auto; padding: 0 16px">
      <table style="min-width: 560px; border-collapse: collapse; background: #FFFFFF; border-radius: 6px; table-layout: fixed">
        <caption style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Comparación de 3 taladros</caption>
        <thead>
          <tr style="vertical-align: top">
            <td style="width: 110px"></td>
            <sc-for list="{{products}}" as="p" hint-placeholder-count="3">
              <th scope="col" style="width: 150px; padding: 12px 10px; text-align: left; border-left: 1px solid #E3E7EA; font-weight: 400">
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <a href="Movil-4-Ficha.dc.html" style="font-weight: 600; text-decoration: none; line-height: 1.25">{{p.name}}</a>
                  <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; line-height: 1">{{p.price}}</span>
                  <a href="Movil-5-Carrito.dc.html" style="min-height: 44px; border-radius: 4px; background: #C2410C; color: #FFFFFF; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Agregar</a>
                </div>
              </th>
            </sc-for>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
            <tr style="border-top: 1px solid #E3E7EA; background: {{r.bg}}">
              <th scope="row" style="padding: 10px; text-align: left; font-weight: 600">{{r.k}}</th>
              <sc-for list="{{r.vals}}" as="v" hint-placeholder-count="3">
                <td style="padding: 10px; border-left: 1px solid #E3E7EA; font-weight: {{v.w}}">{{v.t}}</td>
              </sc-for>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { only: false }; }
  renderVals() {
    const data = [
      ['Marca', ['Volta', 'Brava', 'Ferro']],
      ['Alimentación', ['Batería 20 V', 'Cable 127 V', 'Cable 127 V']],
      ['Mandril', ['1/2 pulg', 'SDS Plus', '3/8 pulg']],
      ['Velocidad', ['1,800 rpm', '1,100 rpm', '2,800 rpm']],
      ['Percutor', ['Sí', 'Sí', 'No']],
      ['Reversa', ['Sí', 'Sí', 'Sí']],
      ['Peso', ['1.6 kg', '2.9 kg', '1.4 kg']],
      ['Stock aquí', ['12', '3', '20']]
    ];
    const only = this.state.only;
    return {
      only,
      toggle: () => this.setState({ only: !this.state.only }),
      products: [
        { name: 'Taladro percutor 20 V', price: '$2,149' },
        { name: 'Rotomartillo SDS Plus', price: '$2,899' },
        { name: 'Taladro eléctrico 600 W', price: '$849' }
      ],
      rows: data.map(([k, vals]) => ({ k, diff: new Set(vals).size > 1, vals }))
        .filter(r => !only || r.diff)
        .map(r => ({ k: r.k, bg: r.diff ? '#FFF4EC' : '#FFFFFF', vals: r.vals.map(t => ({ t, w: r.diff ? '600' : '400' })) }))
    };
  }
}
</script>
</body>
</html>
