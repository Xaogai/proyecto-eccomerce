<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Entregar pedido en sucursal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#15181B}a:hover{color:#C2410C}
:focus-visible{outline:3px solid #F26B2A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #EDEFF1; color: #15181B; font-family: Barlow, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.45">
  <header style="background: #15181B; color: #FFFFFF; padding: 8px 10px; display: flex; align-items: center; gap: 4px">
    <a href="Sucursal-2-Recoleccion.dc.html" aria-label="Volver a pedidos" style="width: 44px; height: 44px; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 style="margin: 0; flex: 1; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; text-transform: uppercase">Entregar pedido</h1>
    <span style="font-size: 13px; color: #C9D0D6; padding-right: 6px">Toluca Centro</span>
  </header>
  <main style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-if value="{{stepCode}}" hint-placeholder-val="{{ true }}">
      <section style="background: #FFFFFF; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <label for="cod" style="font-weight: 600">Código de entrega del cliente</label>
        <input id="cod" type="text" inputmode="numeric" value="{{code}}" onInput="{{type}}" aria-invalid="{{bad}}" aria-describedby="cod-msg" style="height: 60px; border: {{border}}; border-radius: 4px; padding: 0 14px; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; letter-spacing: .15em">
        <span id="cod-msg" style="font-size: 15px; font-weight: {{mw}}; color: {{mc}}">{{codeMsg}}</span>
        <button type="button" onClick="{{verify}}" style="min-height: 52px; border: 0; border-radius: 4px; background: #C2410C; color: #FFFFFF; font: inherit; font-weight: 600">Buscar pedido</button>
        <button type="button" style="min-height: 48px; border: 1px solid #15181B; border-radius: 4px; background: #FFFFFF; font: inherit; font-weight: 600">Escanear código del correo</button>
      </section>
    </sc-if>
    <sc-if value="{{stepCheck}}" hint-placeholder-val="{{ false }}">
      <section style="background: #FFFFFF; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 26px">Pedido 10482 · Ana López</h2>
        <span style="color: #4E5862; font-size: 15px">Estante R-03 · pagado con tarjeta</span>
        <ul style="margin: 0; padding-left: 20px; font-size: 15px"><li>Taladro percutor 20 V con 1 batería × 1</li><li>Brocas para concreto, 5 piezas × 2</li></ul>
        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column">
          <legend style="font-weight: 600; margin-bottom: 4px">Antes de entregar</legend>
          <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="checkbox" checked="{{c1}}" onChange="{{t1}}" style="width: 24px; height: 24px; flex: none; accent-color: #C2410C"> El nombre coincide con la INE</label>
          <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="checkbox" checked="{{c2}}" onChange="{{t2}}" style="width: 24px; height: 24px; flex: none; accent-color: #C2410C"> El cliente revisó los productos</label>
        </fieldset>
        <button type="button" onClick="{{deliver}}" disabled="{{notReady}}" style="min-height: 52px; border: 0; border-radius: 4px; background: {{dBg}}; color: #FFFFFF; font: inherit; font-weight: 600">Confirmar entrega</button>
      </section>
    </sc-if>
    <sc-if value="{{stepDone}}" hint-placeholder-val="{{ false }}">
      <section role="status" style="background: #FFFFFF; border-radius: 6px; padding: 18px; border: 2px solid #1E7A46; display: flex; flex-direction: column; gap: 8px">
        <strong style="color: #1E7A46; font-size: 18px">Pedido 10482 entregado</strong>
        <span>Enviamos el comprobante a ana@ejemplo.com.</span>
        <a href="Sucursal-2-Recoleccion.dc.html" style="min-height: 50px; border-radius: 4px; background: #15181B; color: #FFFFFF; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Volver a pedidos</a>
      </section>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 'code', code: '48217', err: false, c1: false, c2: false }; }
  renderVals() {
    const s = this.state;
    const ready = s.c1 && s.c2;
    return {
      stepCode: s.step === 'code', stepCheck: s.step === 'check', stepDone: s.step === 'done',
      code: s.code, bad: s.err ? 'true' : 'false', border: s.err ? '2px solid #B42318' : '1px solid #B9C1C8',
      codeMsg: s.err ? 'No hay pedidos listos con ese código en esta sucursal. Revisa los 5 dígitos.' : 'Pídelo al cliente junto con su INE. Prueba con 48217.',
      mc: s.err ? '#B42318' : '#4E5862', mw: s.err ? '600' : '400',
      type: e => this.setState({ code: e.target.value, err: false }),
      verify: () => this.setState(s.code.trim() === '48217' ? { step: 'check' } : { err: true }),
      c1: s.c1, c2: s.c2, t1: () => this.setState({ c1: !this.state.c1 }), t2: () => this.setState({ c2: !this.state.c2 }),
      notReady: !ready, dBg: ready ? '#C2410C' : '#8E979F',
      deliver: () => { if (ready) this.setState({ step: 'done' }); }
    };
  }
}
</script>
</body>
</html>
