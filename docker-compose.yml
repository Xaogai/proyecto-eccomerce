services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://ecommerce:ecommerce@postgres:5432/ecommerce
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Define JWT_SECRET_KEY en .env (ver .env.example)}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-stripe}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      PASARELA_SANDBOX: ${PASARELA_SANDBOX:-true}
      SEED_SYNTHETIC_DATA: ${SEED_SYNTHETIC_DATA:-true}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_DIR: /app/backups/local
      # La copia en otro medio se monta con docker-compose.override.yml (ver README, "Respaldos").
      BACKUP_OFFSITE_DIR: ${BACKUP_OFFSITE_DIR:-}
      DB_ROLE_AUDITOR_PASSWORD: ${DB_ROLE_AUDITOR_PASSWORD:-}
      DB_ROLE_APP_PASSWORD: ${DB_ROLE_APP_PASSWORD:-}
      DB_ROLE_SUCURSAL_PASSWORD: ${DB_ROLE_SUCURSAL_PASSWORD:-}
      DB_ROLE_RESPALDO_PASSWORD: ${DB_ROLE_RESPALDO_PASSWORD:-}
      DB_AUDIT_SERVER_SETTINGS: ${DB_AUDIT_SERVER_SETTINGS:-false}
    ports: ["8000:8000"]
    volumes:
      - media:/app/media
      - backups:/app/backups/local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["5173:80"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  media:
  backups:
