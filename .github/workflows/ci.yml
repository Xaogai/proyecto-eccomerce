name: Ferremarket Quality & Audit CI (PA-ECOM-001)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  backend-quality-gates:
    name: Backend Linting, SAST, SCA, Migrations & Coverage (>=80%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Secret Scanning Gate (AE-19 - llaves, contraseñas y valores por defecto de secretos)
        run: pytest backend/tests/test_respaldos_y_controles.py::test_sin_secretos_en_el_codigo -q -p no:cacheprovider

      - name: Verify PEP 8, Security Rules & McCabe Cyclomatic Complexity <= 10 (RQ-MANT-001, AE-16, AE-24 SAST)
        run: ruff check backend run_app.py

      - name: Verify Static Typing (mypy - AE-16)
        run: mypy backend run_app.py

      - name: Verify Dependency Lock & SCA Check (AE-24)
        run: pip check

      - name: Run Pytest Suite & Coverage Gate (>=80% Global & Critical Modules - AE-27, AE-28)
        env:
          DATABASE_URL: sqlite:///./ci_ferremarket.db
        run: pytest --cov=backend --cov-fail-under=80 --junitxml=pytest_report.xml --cov-report=json:coverage.json

  backend-postgresql:
    name: Backend en PostgreSQL 16 (migraciones, controles, roles y respaldos)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt
      - name: Pruebas contra PostgreSQL
        env:
          DATABASE_URL: sqlite:///./ci_ferremarket.db
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: pytest backend/tests/test_postgresql.py -v -p no:cacheprovider

  backend-portabilidad:
    name: Backend en ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt
      - name: Pruebas del backend
        env:
          DATABASE_URL: sqlite:///./ci_ferremarket.db
        run: pytest -q -p no:cacheprovider

  frontend-build-gate:
    name: Frontend TypeScript, SCA & Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies & SCA audit (AE-24)
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Lint & Build React TypeScript bundle (AE-34)
        working-directory: frontend
        run: |
          npm run lint
          npm run build
