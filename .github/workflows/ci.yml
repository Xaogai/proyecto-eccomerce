name: Ferremarket Quality & Audit CI (PA-ECOM-001)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  backend-quality-gates:
    name: Backend Linting, Typing, Migrations & Coverage (>=80%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify PEP 8 & McCabe Cyclomatic Complexity <= 10 (RQ-MANT-001)
        run: ruff check backend run_app.py

      - name: Verify Static Typing (mypy)
        run: mypy backend run_app.py

      - name: Run Pytest Suite & Coverage Gate (>=80%)
        env:
          DATABASE_URL: sqlite:///./ci_ferremarket.db
        run: pytest --cov=backend --cov-fail-under=80

  frontend-build-gate:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies & audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Lint & Build React TypeScript bundle
        working-directory: frontend
        run: |
          npm run lint
          npm run build
