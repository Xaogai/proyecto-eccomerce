# CI del frontend (sec. 15.1 del Documento de Calidad): main solo recibe PRs con este flujo en verde.
name: frontend

on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']

defaults:
  run:
    working-directory: frontend

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Linter
        run: npm run lint
      - name: Formato
        run: npx prettier --check src e2e
      - name: Pruebas y cobertura (mínimo 80% en módulos críticos)
        run: npm run coverage
      - name: Tipos, build y presupuesto de 200 KB
        run: npm run build
      - name: Dependencias sin vulnerabilidades altas
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: End-to-end en 5 navegadores con revisión de accesibilidad
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
